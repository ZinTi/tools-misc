<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FileBox · 琥珀传送</title>
    <style>
        /* ========== 全局深色 + 玻璃拟态 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at 20% 30%, #1a1025, #0b0e1a);
            min-height: 100vh;
            display: flex;
            color: #e0d6c8;
        }

        /* 侧边导航栏 — 玻璃琥珀 */
        .sidebar {
            width: 200px;
            min-height: 100vh;
            background: rgba(20, 15, 30, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-right: 1px solid rgba(240, 160, 48, 0.25);
            box-shadow: 4px 0 30px rgba(240, 160, 48, 0.08);
            display: flex;
            flex-direction: column;
            padding: 30px 16px;
            position: sticky;
            top: 0;
            align-self: flex-start;
            flex-shrink: 0;
        }
        .sidebar .logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #f0a030;
            text-shadow: 0 0 12px rgba(240, 160, 48, 0.3);
            margin-bottom: 40px;
            text-align: center;
        }
        .sidebar .logo span {
            display: block;
            font-size: 0.8rem;
            font-weight: 300;
            letter-spacing: 4px;
            color: #a09080;
            margin-top: 4px;
        }
        .nav-btn {
            background: transparent;
            border: none;
            color: #b0a898;
            font-size: 1.05rem;
            padding: 14px 20px;
            margin-bottom: 8px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: left;
            font-weight: 500;
            border-left: 3px solid transparent;
            background: rgba(255, 255, 255, 0.02);
        }
        .nav-btn:hover {
            background: rgba(240, 160, 48, 0.10);
            color: #f0d0a0;
            border-left-color: #f0a030;
            box-shadow: inset 0 0 20px rgba(240, 160, 48, 0.05);
        }
        .nav-btn.active {
            color: #f0c880;
            background: rgba(240, 160, 48, 0.12);
            border-left-color: #f0a030;
            box-shadow: 0 0 25px rgba(240, 160, 48, 0.08);
        }

        /* 主内容区 */
        .main {
            flex: 1;
            padding: 30px 40px;
            max-width: calc(100% - 200px);
        }
        .page-panel {
            display: none;
            animation: fadeSlide 0.3s ease;
        }
        .page-panel.active {
            display: block;
        }
        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* 玻璃卡片 */
        .glass-card {
            background: rgba(30, 25, 45, 0.50);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 24px;
            padding: 28px 30px;
            border: 1px solid rgba(240, 160, 48, 0.15);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(240, 160, 48, 0.05) inset;
            margin-bottom: 28px;
        }
        .glass-card h2 {
            font-weight: 400;
            font-size: 1.6rem;
            margin-bottom: 20px;
            color: #f0c880;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(240, 160, 48, 0.15);
            padding-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .glass-card h2 i {
            font-style: normal;
            font-size: 1.8rem;
        }

        /* 表单控件 */
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 400;
            color: #c0b0a0;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }
        .form-group input[type="file"],
        .form-group input[type="text"] {
            width: 100%;
            padding: 10px 16px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(240, 160, 48, 0.20);
            border-radius: 12px;
            color: #e8ddd0;
            font-size: 0.95rem;
            transition: border 0.2s;
            outline: none;
        }
        .form-group input:focus {
            border-color: #f0a030;
            box-shadow: 0 0 16px rgba(240, 160, 48, 0.15);
        }
        .form-group input[type="file"]::file-selector-button {
            background: rgba(240, 160, 48, 0.15);
            border: 1px solid #f0a030;
            border-radius: 8px;
            color: #f0c880;
            padding: 6px 16px;
            margin-right: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        .form-group input[type="file"]::file-selector-button:hover {
            background: rgba(240, 160, 48, 0.25);
        }
        .btn {
            background: rgba(240, 160, 48, 0.12);
            border: 1px solid rgba(240, 160, 48, 0.35);
            color: #f0c880;
            padding: 10px 28px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s;
            backdrop-filter: blur(4px);
            letter-spacing: 0.5px;
        }
        .btn:hover {
            background: rgba(240, 160, 48, 0.25);
            border-color: #f0a030;
            box-shadow: 0 0 30px rgba(240, 160, 48, 0.15);
            color: #fae0c0;
        }
        .btn:active {
            transform: scale(0.97);
        }

        /* 进度条 */
        .progress-wrap {
            margin: 16px 0 10px;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f0a030, #f5d080);
            border-radius: 10px;
            transition: width 0.2s;
        }
        .progress-text {
            font-size: 0.85rem;
            color: #b0a090;
        }
        .upload-result {
            margin-top: 12px;
            padding: 12px 16px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.25);
            border-left: 3px solid #f0a030;
            word-break: break-all;
            font-size: 0.9rem;
        }
        .upload-result .hash {
            font-family: monospace;
            color: #f0d080;
            background: rgba(0,0,0,0.3);
            padding: 2px 10px;
            border-radius: 6px;
            display: inline-block;
            margin-top: 4px;
        }
        .upload-result.error {
            border-left-color: #e06050;
            color: #e8a090;
        }

        /* 文件列表 */
        .path-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .path-bar input {
            flex: 1;
        }
        .file-list {
            list-style: none;
        }
        .file-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            transition: 0.15s;
        }
        .file-list li:hover {
            background: rgba(240, 160, 48, 0.04);
            border-radius: 8px;
            padding-left: 8px;
            padding-right: 8px;
        }
        .file-list a {
            color: #f0c880;
            text-decoration: none;
            cursor: pointer;
        }
        .file-list a:hover {
            text-decoration: underline;
            color: #fae0b0;
        }
        .file-meta {
            font-size: 0.8rem;
            color: #8a8078;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .dir-badge {
            background: rgba(240, 160, 48, 0.12);
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            color: #c0a888;
        }
        .empty {
            color: #6a6058;
            font-style: italic;
            padding: 16px 0;
        }

        /* 共享编辑器 */
        #editor {
            width: 100%;
            height: 480px;
            padding: 18px;
            background: rgba(0, 0, 0, 0.40);
            border: 1px solid rgba(240, 160, 48, 0.15);
            border-radius: 16px;
            color: #e8ddd0;
            font-size: 1rem;
            font-family: 'Fira Code', monospace;
            resize: vertical;
            outline: none;
            transition: border 0.2s;
        }
        #editor:focus {
            border-color: #f0a030;
            box-shadow: 0 0 24px rgba(240, 160, 48, 0.08);
        }
        .status {
            font-size: 0.9rem;
            color: #a09080;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status.online {
            color: #80d080;
        }
        .status.offline {
            color: #d08070;
        }

        /* 响应式 */
        @media (max-width: 720px) {
            .sidebar {
                width: 70px;
                padding: 20px 8px;
            }
            .sidebar .logo span { display: none; }
            .sidebar .logo { font-size: 1.2rem; }
            .nav-btn {
                font-size: 0.85rem;
                padding: 12px 10px;
                text-align: center;
                border-left: none;
                border-bottom: 2px solid transparent;
            }
            .nav-btn.active {
                border-left: none;
                border-bottom-color: #f0a030;
            }
            .main {
                padding: 20px 16px;
                max-width: calc(100% - 70px);
            }
            .glass-card { padding: 20px; }
        }
    </style>
</head>
<body>
    <!-- ===== 侧边导航 ===== -->
    <nav class="sidebar">
        <div class="logo">✦<span>filebox</span></div>
        <button class="nav-btn active" data-tab="upload">⬆ 上传</button>
        <button class="nav-btn" data-tab="download">⬇ 下载</button>
        <button class="nav-btn" data-tab="editor">✎ 共享编辑</button>
    </nav>

    <!-- ===== 主内容 ===== -->
    <div class="main">

        <!-- ========== 页面1：上传 ========== -->
        <section id="page-upload" class="page-panel active">
            <div class="glass-card">
                <h2><i>⬆</i> 上传文件</h2>
                <form id="uploadForm" enctype="multipart/form-data">
                    <div class="form-group">
                        <label for="fileInput">选择文件</label>
                        <input type="file" id="fileInput" name="file" required>
                    </div>
                    <div class="form-group">
                        <label for="targetPath">目标目录（相对于根）</label>
                        <input type="text" id="targetPath" value="." placeholder="例如: subdir 或 .">
                    </div>
                    <button type="submit" class="btn" id="uploadBtn">开始上传</button>
                </form>

                <!-- 进度条 -->
                <div class="progress-wrap" id="progressWrap" style="display:none;">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="progress-text" id="progressText"></div>

                <!-- 结果 -->
                <div id="uploadResult"></div>
            </div>
        </section>

        <!-- ========== 页面2：下载 ========== -->
        <section id="page-download" class="page-panel">
            <div class="glass-card">
                <h2><i>⬇</i> 下载文件</h2>
                <div class="path-bar">
                    <input type="text" id="listPath" value="." placeholder="路径 (如 subdir)">
                    <button class="btn" id="refreshBtn">刷新</button>
                </div>
                <ul class="file-list" id="fileList">
                    <li class="empty">加载中...</li>
                </ul>
            </div>
        </section>

        <!-- ========== 页面3：共享编辑 ========== -->
        <section id="page-editor" class="page-panel">
            <div class="glass-card">
                <h2><i>✎</i> 共享文本编辑</h2>
                <div class="status" id="status">⏳ 连接中...</div>
                <textarea id="editor" placeholder="在这里输入文字，所有客户端实时同步..."></textarea>
                <div style="margin-top:12px; color:#6a6058; font-size:0.85rem;">💡 所有打开的浏览器/手机将同步编辑内容</div>
            </div>
        </section>

    </div>

    <script>
        // ============================================================
        // 1. 导航切换
        // ============================================================
        const navBtns = document.querySelectorAll('.nav-btn');
        const panels = {
            upload: document.getElementById('page-upload'),
            download: document.getElementById('page-download'),
            editor: document.getElementById('page-editor')
        };

        navBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                navBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const tab = btn.dataset.tab;
                Object.keys(panels).forEach(key => {
                    panels[key].classList.toggle('active', key === tab);
                });
            });
        });

        // ============================================================
        // 2. 上传（带进度 + SHA256）
        // ============================================================
        const uploadForm = document.getElementById('uploadForm');
        const fileInput = document.getElementById('fileInput');
        const targetPath = document.getElementById('targetPath');
        const uploadBtn = document.getElementById('uploadBtn');
        const progressWrap = document.getElementById('progressWrap');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const uploadResult = document.getElementById('uploadResult');

        uploadForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const file = fileInput.files[0];
            if (!file) return;

            // 重置 UI
            uploadResult.innerHTML = '';
            progressWrap.style.display = 'block';
            progressBar.style.width = '0%';
            progressText.textContent = '准备上传...';
            uploadBtn.disabled = true;

            const formData = new FormData();
            formData.append('file', file);
            formData.append('path', targetPath.value.trim() || '.');

            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/api/upload', true);

            // 进度
            xhr.upload.addEventListener('progress', (evt) => {
                if (evt.lengthComputable) {
                    const pct = Math.round((evt.loaded / evt.total) * 100);
                    progressBar.style.width = pct + '%';
                    progressText.textContent = pct + '%  (' + (evt.loaded / 1024 / 1024).toFixed(1) + ' MB / ' +
                        (evt.total / 1024 / 1024).toFixed(1) + ' MB)';
                }
            });

            xhr.onload = function() {
                uploadBtn.disabled = false;
                progressWrap.style.display = 'none';
                progressText.textContent = '';

                if (xhr.status === 200) {
                    try {
                        const resp = JSON.parse(xhr.responseText);
                        if (resp.status === 'ok') {
                            uploadResult.innerHTML = `
                                <div class="upload-result">
                                    ✅ 上传成功<br>
                                    <span style="color:#b0a090;">SHA256</span>
                                    <span class="hash">${resp.sha256}</span>
                                </div>
                            `;
                        } else {
                            uploadResult.innerHTML = `<div class="upload-result error">❌ 服务器返回错误</div>`;
                        }
                    } catch (e) {
                        uploadResult.innerHTML = `<div class="upload-result error">❌ 解析响应失败</div>`;
                    }
                } else {
                    uploadResult.innerHTML = `<div class="upload-result error">❌ 上传失败 (HTTP ${xhr.status})</div>`;
                }
                fileInput.value = '';
            };

            xhr.onerror = function() {
                uploadBtn.disabled = false;
                progressWrap.style.display = 'none';
                progressText.textContent = '';
                uploadResult.innerHTML = `<div class="upload-result error">❌ 网络错误，上传中断</div>`;
            };

            xhr.send(formData);
        });

        // ============================================================
        // 3. 下载文件列表（含父目录）
        // ============================================================
        const listPath = document.getElementById('listPath');
        const refreshBtn = document.getElementById('refreshBtn');
        const fileList = document.getElementById('fileList');

        // 获取父目录路径
        function getParentPath(path) {
            if (path === '.' || path === '') return '.';
            const parts = path.split('/');
            parts.pop();
            return parts.join('/') || '.';
        }

        async function loadFiles(path) {
            try {
                const resp = await fetch(`/api/list?path=${encodeURIComponent(path)}`);
                if (!resp.ok) {
                    const text = await resp.text();
                    throw new Error(text);
                }
                const data = await resp.json();

                let html = '';
                // 添加父目录（根目录不显示）
                if (path !== '.' && path !== '') {
                    const parent = getParentPath(path);
                    html += `<li>
                        <span>
                            <span>📂 </span>
                            <a href="#" class="file-name parent-dir" data-path="${parent}" data-isdir="true">Parent directory/</a>
                        </span>
                        <span class="file-meta"></span>
                    </li>`;
                }

                if (data.length === 0) {
                    html += '<li class="empty">📭 空目录</li>';
                } else {
                    data.forEach(item => {
                        const icon = item.isDir ? '📁' : '📄';
                        const size = item.isDir ? '' : (item.size / 1024).toFixed(1) + ' KB';
                        const mod = new Date(item.modTime).toLocaleString();
                        let downloadLink = '';
                        if (!item.isDir) {
                            const dlPath = path === '.' ? item.name : path + '/' + item.name;
                            downloadLink = `<a href="/api/download?path=${encodeURIComponent(dlPath)}" download>下载</a>`;
                        } else {
                            downloadLink = `<span class="dir-badge">目录</span>`;
                        }
                        const displayPath = path === '.' ? item.name : path + '/' + item.name;
                        html += `<li>
                            <span>
                                <span>${icon} </span>
                                <a href="#" class="file-name" data-path="${displayPath}" data-isdir="${item.isDir}">${item.name}</a>
                            </span>
                            <span class="file-meta">${size} ${mod} ${downloadLink}</span>
                        </li>`;
                    });
                }

                fileList.innerHTML = html;

                // 为所有文件名链接添加点击事件
                document.querySelectorAll('.file-name').forEach(el => {
                    el.addEventListener('click', (e) => {
                        e.preventDefault();
                        const isDir = el.dataset.isdir === 'true';
                        const targetPath = el.dataset.path;
                        if (isDir) {
                            // 如果是父目录或子目录，更新路径并加载
                            listPath.value = targetPath;
                            loadFiles(targetPath);
                        } else {
                            // 文件直接下载（跳转）
                            window.location.href = `/api/download?path=${encodeURIComponent(targetPath)}`;
                        }
                    });
                });
            } catch (err) {
                fileList.innerHTML = `<li class="empty">❌ 错误: ${err.message}</li>`;
            }
        }

        refreshBtn.addEventListener('click', () => loadFiles(listPath.value));
        // 初始加载
        loadFiles('.');
        // ============================================================
        // 4. 共享文本编辑器 (WebSocket)
        // ============================================================
        const editor = document.getElementById('editor');
        const statusEl = document.getElementById('status');

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws/editor`;
        let ws = null;

        function connectEditor() {
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                statusEl.textContent = '✅ 已连接 (实时同步)';
                statusEl.className = 'status online';
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.text !== undefined && editor.value !== data.text) {
                        editor.value = data.text;
                    }
                } catch (e) {
                    console.warn('parse error', e);
                }
            };

            ws.onerror = (error) => {
                statusEl.textContent = '❌ 连接错误，尝试重连...';
                statusEl.className = 'status offline';
                console.error('WebSocket error:', error);
            };

            ws.onclose = () => {
                statusEl.textContent = '🔌 连接断开，3秒后重连...';
                statusEl.className = 'status offline';
                setTimeout(connectEditor, 3000);
            };
        }

        editor.addEventListener('input', () => {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            ws.send(JSON.stringify({ text: editor.value }));
        });

        connectEditor();
    </script>
</body>
</html>
